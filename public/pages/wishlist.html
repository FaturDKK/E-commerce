<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - FathurProject</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/wishlist.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo"><i class="fas fa-motorcycle"></i><span>FathurProject</span></div>
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <div id="navbarContainer"></div>

    <main class="wishlist-page">
        <div class="container">
            <div class="page-header">
                <h1><i class="fas fa-heart" style="color:var(--danger);"></i> Wishlist</h1>
                <p id="wishlistCount">0 produk favorit</p>
            </div>

            <div class="wishlist-grid" id="wishlistGrid">
                <!-- Rendered by JS -->
            </div>

            <div class="empty-wishlist" id="emptyWishlist" style="display:none;">
                <i class="fas fa-heart"></i>
                <h3>Wishlist Kosong</h3>
                <p>Mulai tambahkan produk favoritmu!</p>
                <a href="/pages/products.html" class="btn-primary">Jelajahi Produk</a>
            </div>
        </div>
    </main>

    <div id="footerContainer"></div>
    <div id="toastContainer"></div>

    <script src="/js/components.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/wishlist.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
