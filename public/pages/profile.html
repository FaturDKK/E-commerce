<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - FathurProject</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo"><i class="fas fa-motorcycle"></i><span>FathurProject</span></div>
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <div id="navbarContainer"></div>

    <main class="profile-page">
        <div class="container">
            <div class="page-header">
                <h1><i class="fas fa-user-circle"></i> Profil Saya</h1>
                <p>Kelola informasi akun Anda</p>
            </div>

            <div class="profile-content">
                <!-- Sidebar -->
                <div class="profile-sidebar">
                    <div class="profile-card">
                        <div class="profile-avatar" id="profileAvatar">
                            <span id="avatarInitial">U</span>
                        </div>
                        <h3 id="profileName">User</h3>
                        <p id="profileEmail">user@email.com</p>
                        <div class="profile-menu">
                            <a href="/pages/profile.html" class="menu-item active">
                                <i class="fas fa-user"></i> Profil
                            </a>
                            <a href="/pages/orders.html" class="menu-item">
                                <i class="fas fa-box"></i> Pesanan
                            </a>
                            <a href="/pages/wishlist.html" class="menu-item">
                                <i class="fas fa-heart"></i> Wishlist
                            </a>
                            <button onclick="handleLogout()" class="menu-item logout">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="profile-main">
                    <div class="profile-form-card">
                        <h3>Informasi Akun</h3>
                        <form id="profileForm" onsubmit="updateProfile(event)">
                            <div class="form-group">
                                <label>Nama Lengkap</label>
                                <input type="text" id="profileFullName" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="profileEmailInput" required>
                            </div>
                            <div class="form-group">
                                <label>Nomor Telepon</label>
                                <input type="tel" id="profilePhone" placeholder="0812-3456-7890">
                            </div>
                            <div class="form-group">
                                <label>Alamat</label>
                                <textarea id="profileAddress" rows="3" placeholder="Jalan, RT/RW, Kelurahan, Kecamatan"></textarea>
                            </div>
                            <button type="submit" class="btn-primary">
                                <i class="fas fa-save"></i> Simpan Perubahan
                            </button>
                        </form>
                    </div>

                    <div class="profile-form-card">
                        <h3>Ubah Password</h3>
                        <form id="passwordForm" onsubmit="changePassword(event)">
                            <div class="form-group">
                                <label>Password Lama</label>
                                <div class="password-wrapper">
                                    <input type="password" id="oldPassword" required>
                                    <button type="button" onclick="togglePassword('oldPassword')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Password Baru</label>
                                <div class="password-wrapper">
                                    <input type="password" id="newPassword" required minlength="8">
                                    <button type="button" onclick="togglePassword('newPassword')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Konfirmasi Password Baru</label>
                                <div class="password-wrapper">
                                    <input type="password" id="confirmPassword" required>
                                    <button type="button" onclick="togglePassword('confirmPassword')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn-secondary">
                                <i class="fas fa-key"></i> Ubah Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footerContainer"></div>
    <div id="toastContainer"></div>

    <script src="/js/components.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
