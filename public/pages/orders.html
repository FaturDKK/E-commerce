<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan - FathurProject</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo"><i class="fas fa-motorcycle"></i><span>FathurProject</span></div>
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <div id="navbarContainer"></div>

    <main class="orders-page">
        <div class="container">
            <div class="page-header">
                <h1><i class="fas fa-box"></i> Pesanan Saya</h1>
                <p>Lihat riwayat pesanan Anda</p>
            </div>

            <div class="orders-content">
                <!-- Sidebar -->
                <div class="profile-sidebar">
                    <div class="profile-card">
                        <div class="profile-avatar" id="ordersAvatar">
                            <span id="ordersInitial">U</span>
                        </div>
                        <h3 id="ordersName">User</h3>
                        <p id="ordersEmail">user@email.com</p>
                        <div class="profile-menu">
                            <a href="/pages/profile.html" class="menu-item">
                                <i class="fas fa-user"></i> Profil
                            </a>
                            <a href="/pages/orders.html" class="menu-item active">
                                <i class="fas fa-box"></i> Pesanan
                            </a>
                            <a href="/pages/wishlist.html" class="menu-item">
                                <i class="fas fa-heart"></i> Wishlist
                            </a>
                            <button onclick="handleLogout()" class="menu-item logout">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Orders List -->
                <div class="orders-main">
                    <div class="orders-filter">
                        <button class="filter-btn active" data-filter="all">Semua</button>
                        <button class="filter-btn" data-filter="pending">Pending</button>
                        <button class="filter-btn" data-filter="processing">Diproses</button>
                        <button class="filter-btn" data-filter="shipped">Dikirim</button>
                        <button class="filter-btn" data-filter="completed">Selesai</button>
                        <button class="filter-btn" data-filter="cancelled">Dibatalkan</button>
                    </div>

                    <div class="orders-list" id="ordersList">
                        <!-- Rendered by JS -->
                    </div>

                    <div class="empty-orders" id="emptyOrders" style="display:none;">
                        <i class="fas fa-box-open"></i>
                        <h3>Belum Ada Pesanan</h3>
                        <p>Mulai belanja sekarang!</p>
                        <a href="/pages/products.html" class="btn-primary">Belanja Sekarang</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footerContainer"></div>
    <div id="toastContainer"></div>

    <script src="/js/components.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/orders.js"></script>
</body>
</html>
