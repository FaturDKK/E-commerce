<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - FathurProject</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo"><i class="fas fa-motorcycle"></i><span>FathurProject</span></div>
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card glass-card">
                <div class="auth-header">
                    <a href="/" class="auth-logo">
                        <i class="fas fa-motorcycle"></i>
                        <span>FathurProject</span>
                    </a>
                    <h2>Buat Akun Baru</h2>
                    <p>Mulai belanja spare part motor favoritmu</p>
                </div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Nama Lengkap</label>
                        <input type="text" id="registerName" placeholder="Masukkan nama Anda" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="registerEmail" placeholder="Masukkan email Anda" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="registerPassword" placeholder="Minimal 8 karakter" required minlength="8">
                            <button type="button" onclick="togglePassword('registerPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-check-circle"></i> Konfirmasi Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="registerConfirm" placeholder="Ulangi password" required>
                            <button type="button" onclick="togglePassword('registerConfirm')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="agree-terms">
                            <input type="checkbox" required> 
                            Saya setuju dengan <a href="#">Syarat & Ketentuan</a>
                        </label>
                    </div>
                    <button type="submit" class="btn-primary btn-auth">
                        <i class="fas fa-user-plus"></i> Daftar
                    </button>
                </form>

                <div class="auth-divider">
                    <span>atau</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn facebook">
                        <i class="fab fa-facebook"></i> Facebook
                    </button>
                </div>

                <p class="auth-footer">
                    Sudah punya akun? <a href="/pages/login.html">Masuk Sekarang</a>
                </p>
            </div>
        </div>
    </main>

    <div id="toastContainer"></div>

    <script src="/js/toast.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
